<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ .Site.Params.description }}">
    <meta name="theme-color" content="#090909">
    <title>{{ .Site.Title }} — escrita acadêmica</title>
    <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
  </head>
  <body
    data-compiler-wasm="{{ "wasm/compiler/typst_ts_web_compiler_bg.wasm" | relURL }}"
    data-renderer-wasm="{{ "wasm/renderer/typst_ts_renderer_bg.wasm" | relURL }}"
    data-case-model-pdf="{{ "models/relatorio-case-civil.pdf" | relURL }}"
  >
    <div id="app"></div>
    {{ $options := dict "target" "es2022" "minify" true }}
    {{ with resources.Get "js/main.js" | js.Build $options }}
      <script defer src="{{ .RelPermalink }}"></script>
    {{ end }}
  </body>
</html>
