[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistente-academico"
version = "0.1.0"
description = "Nova aplicação do Assistente Acadêmico"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "gunicorn>=23,<24",
  "google-auth>=2.29,<3",
  "requests>=2.32,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
